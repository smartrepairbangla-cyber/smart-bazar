<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Bazar</title>
<style>
body{margin:0;font-family:Arial;background:#f5f6fa}
header{background:#087b45;color:white;padding:22px;text-align:center}
.search{padding:15px;text-align:center}
input{padding:12px;width:75%;border:1px solid #ddd;border-radius:8px}
main{text-align:center;padding:25px}
.products{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.card{background:white;padding:20px;border-radius:12px;width:190px}
button{background:#087b45;color:white;border:0;padding:10px;border-radius:7px}
</style>
</head>
<body>
<header>
<h1>🛒 Smart Bazar</h1>
<p>আপনার অনলাইন শপিংয়ের বিশ্বস্ত ঠিকানা</p>
</header>
<div class="search">
<input placeholder="আপনার পছন্দের পণ্য খুঁজুন...">
</div>
<main>
<h2>জনপ্রিয় পণ্য</h2>
<div class="products">
<div class="card">
<h3>📱 Samsung Mobile</h3>
<p>দাম: ৳১৫,০০০</p>
<button>কার্টে যোগ করুন</button>
</div>
<div class="card">
<h3>👕 T-Shirt</h3>
<p>দাম: ৳৫০০</p>
<button>কার্টে যোগ করুন</button>
</div>
</div>
<h2>🤖 Smart Bazar AI</h2>
<p>আপনার কেনাকাটায় আমরা সাহায্য করতে প্রস্তুত!</p>
</main>
</body>
</html>
